<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小科老师">
<meta name="theme-color" content="#0c776c">
<title>小科老师 · BC Science 10 AI 家教</title>
<style>
/* Layout: a full-height chat app. Header (who + topic chips), scrolling transcript, composer pinned to the bottom.
   Same teal-on-paper palette and base colours as the Unit 1 handout so the two feel like one product. */
:root{
  --paper:#fbfdfc; --surface:#ffffff; --stage:#eef4f2; --ink:#14302e; --muted:#5a7471; --line:#d2dfdc;
  --accent:#0c776c; --accent-soft:#dbefeb; --on-accent:#ffffff; --warn:#c23a2c; --warn-soft:#fbe5e1;
  --hl:#fff3c4; --hl-ink:#6b5200; --user:#0c776c; --on-user:#ffffff;
  --A:#d9443a; --T:#e0aa12; --G:#2b9150; --C:#3367d1;
  --display:'Bricolage Grotesque','PingFang SC','PingFang TC','Hiragino Sans GB','Microsoft JhengHei','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --body:'PingFang SC','PingFang TC','Hiragino Sans GB','Microsoft JhengHei','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0d1918; --surface:#132321; --stage:#102320; --ink:#e2eeec; --muted:#93aba7; --line:#25403d;
  --accent:#43c3b1; --accent-soft:#163c37; --on-accent:#06201d; --warn:#ff7b6b; --warn-soft:#3a1d19;
  --hl:#3d3413; --hl-ink:#f3d77a; --user:#1f6f66; --on-user:#ffffff; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;width:100%}

header{border-bottom:1px solid var(--line);background:var(--paper);flex:none}
.hrow{display:flex;align-items:center;gap:12px;padding-block:10px 8px}
.avatar{flex:none;width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
.avatar svg{width:26px;height:26px}
.who{flex:1;min-width:0}
.who b{display:block;font:800 19px/1.2 var(--display)}
.who span{font-size:13px;color:var(--muted)}
.hbtn{flex:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.hbtn:hover{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.quick{display:flex;gap:8px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;max-width:280px;font-size:13.5px;line-height:1.35;text-align:left;padding:6px 11px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer;white-space:normal}
.quick button::before{content:'⚡ ';}
.ver{opacity:.6}
.chip .en{font-family:var(--display);opacity:.7;font-size:12.5px;margin-left:3px}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.log{display:flex;flex-direction:column;gap:18px;padding-block:20px 28px}
.notice{font-size:13px;color:var(--muted);text-align:center;margin:0}
.msg{display:flex;gap:10px;align-items:flex-start;min-width:0}
.msg.user{justify-content:flex-end}
.msg .avatar{width:32px;height:32px;border-radius:10px}
.msg .avatar svg{width:20px;height:20px}
.bubble{min-width:0;max-width:min(640px,86%);border-radius:18px;padding:12px 16px}
.user .bubble{background:var(--user);color:var(--on-user);border-bottom-right-radius:6px;white-space:pre-wrap;word-wrap:break-word}
.user .bubble img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:8px}
.tutor .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 10px}
.md h1,.md h2,.md h3,.md h4{font-size:17.5px;margin:14px 0 6px;color:var(--accent)}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin-bottom:4px}
.md strong{color:var(--accent)}
.md code{font-family:var(--mono);font-size:.92em;background:var(--stage);padding:1px 5px;border-radius:5px}
.md pre{background:var(--stage);padding:10px 12px;border-radius:10px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin:0 0 10px;padding:6px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:6px 0 12px;font-size:15px}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.md th{background:var(--stage)}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.follow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.follow button{font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer;font-weight:600}
.err{color:var(--warn);font-size:15px}
.faqtag{font-size:12.5px;color:var(--hl-ink);background:var(--hl);border-radius:8px;padding:3px 9px;margin-bottom:8px;display:inline-block}
.netbar{background:var(--warn-soft);color:var(--warn);font-size:14px;padding:8px 12px;border-radius:10px;margin:8px 0 0}
.err button{margin-left:8px;font-size:14px;border:1px solid var(--warn);background:none;border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--warn)}

.hello{display:grid;gap:16px;padding-block:8px}
.hello h1{font:800 clamp(26px,5vw,34px)/1.25 var(--display);margin:0;text-wrap:balance}
.hello h1 .seq{font-family:var(--mono);letter-spacing:.12em;font-size:.6em;display:block;margin-top:6px}
.hello p{margin:0;color:var(--muted);max-width:60ch}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.starters{grid-template-columns:1fr}.who span{font-size:12px}}
.starter{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15.5px;line-height:1.5}
.starter:hover{border-color:var(--accent)}
.starter small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:2px}
.tips{font-size:14px;color:var(--muted);background:var(--stage);border-radius:12px;padding:10px 14px}
.tips b{color:var(--ink)}

footer{flex:none;border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.comp{padding-block:10px}
.preview{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.preview img{height:64px;border-radius:8px;border:1px solid var(--line)}
.preview button{font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer}
.row{display:flex;gap:8px;align-items:flex-end}
.iconbtn{flex:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:24px;height:24px;stroke:var(--ink)}
.iconbtn:hover{border-color:var(--accent)}
textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:17px;line-height:1.5;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-height:180px}
textarea:focus,button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.send{flex:none;height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer}
.send[disabled]{opacity:.45;cursor:default}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:6px}

.gate{position:fixed;inset:0;z-index:30;background:var(--paper);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate .card{max-width:440px;width:100%;display:grid;gap:14px}
.gate h2{font:800 28px/1.25 var(--display);margin:0}
.gate p{margin:0;color:var(--muted)}
.gate input{font:700 20px var(--mono);letter-spacing:.08em;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.gate .send{width:100%}
.gate .fine{font-size:13px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="gut">
    <div class="wrap">
      <div class="hrow">
        <div class="avatar" aria-hidden="true"><svg viewBox="0 0 26 26" fill="none"><path d="M7 3c0 7 12 7 12 13s-12 6-12 7M19 3c0 7-12 7-12 13s12 6 12 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M9 7h8M8.5 19h9M11 13h4" stroke="#ffe08a" stroke-width="2" stroke-linecap="round"/></svg></div>
        <div class="who"><b>小科老师</b><span>BC Science 10 AI 家教 · 我是 AI，不是真人老师</span></div>
        <a class="hbtn" href="../">讲义</a>
        <button class="hbtn" id="newChat">新对话</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="选择主题"></div>
      <div class="quick" id="quick" role="group" aria-label="推荐问题"></div>
    </div>
  </header>

  <main id="scroller">
    <div class="wrap gut">
      <div class="log" id="log" aria-live="polite"></div>
    </div>
  </main>

  <footer class="gut">
    <div class="wrap comp">
      <div class="preview" id="preview" hidden><img id="pvImg" alt="要发送的图片"><button id="pvDel">删除图片</button></div>
      <div class="row">
        <button class="iconbtn" id="photoBtn" aria-label="拍照或选择图片" title="拍照问题目"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg></button>
        <input type="file" id="file" accept="image/*" hidden>
        <textarea id="input" rows="1" placeholder="不懂就问，也可以拍照问" aria-label="输入你的问题"></textarea>
        <button class="send" id="send" disabled>发送</button>
      </div>
      <div class="meta"><span><span id="left"></span> <span class="ver">版本 11-12b</span></span><span>答案由 AI 生成，可能出错，重要内容请对照课本</span></div>
    </div>
  </footer>
</div>

<div class="gate" id="gate" hidden>
  <form class="card" id="gateForm">
    <div class="avatar" aria-hidden="true" style="width:56px;height:56px;border-radius:16px"><svg viewBox="0 0 26 26" fill="none" style="width:34px;height:34px"><path d="M7 3c0 7 12 7 12 13s-12 6-12 7M19 3c0 7-12 7-12 13s12 6 12 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M9 7h8M8.5 19h9M11 13h4" stroke="#ffe08a" stroke-width="2" stroke-linecap="round"/></svg></div>
    <h2>你好，我是小科老师</h2>
    <p>我是一位 AI 科学家教，帮你弄懂 BC Science 10 的内容。请输入家长或老师给你的<b>班级口令</b>。</p>
    <label for="code" class="fine">班级口令 Access code</label>
    <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <p class="err" id="gateErr" hidden></p>
    <button class="send" type="submit" id="gateBtn">开始提问</button>
    <p class="fine">我是 AI，不是真人老师，回答可能出错。遇到让你难过或害怕的事，请马上告诉家长或老师。</p>
  </form>
</div>

<script src="config.js"></script>

const FAQ = {"为什么我长得像爸妈，但又不完全一样？": "**一句话：**你的 DNA 一半来自爸爸、一半来自妈妈，但每次传给孩子的\"那一半\"都是随机抽的，再加上极少量新突变，所以你像他们，又不是他们的复制品。\n\n**原理：**\n- 每个人的细胞核里有 **23 对染色体（chromosomes）**，每一对里一条来自爸爸、一条来自妈妈。\n- 爸妈在形成精子和卵子（**配子 gametes**）时，每一对只随机放进一条。光是这种随机组合，一对父母就能组合出超过 **800 万亿**种不同的孩子。\n- 每个基因有不同版本（**等位基因 alleles**），显性、隐性决定了哪些特征表现出来。比如爸妈都是棕眼（Bb），孩子也可能是蓝眼（bb）。\n- 另外，你身上还有几十个爸妈都没有的新**突变（mutations）**，大多数没有影响。\n\n**有趣的是：**任何两个人的 DNA 约 **99.9%** 相同，你和同学所有的不同，都来自剩下的 0.1%。\n\n**检查一下：**为什么亲兄弟姐妹（不是双胞胎）长得也不完全一样？", "化学方程式为什么一定要配平？": "**一句话：**因为化学反应中原子不会凭空产生或消失，只是重新组合，方程式两边每种原子的数目必须相等。这就是**质量守恒定律（law of conservation of mass）**。\n\n**原理：**化学反应就像拆乐高再重新拼：积木换了位置，但一块也没多、一块也没少。所以反应前后，每种原子的个数一样，总质量也一样。\n\n**来龙去脉：**18 世纪末，法国化学家**拉瓦锡（Lavoisier）**把燃烧实验放在**密封容器**里做，反应前后仔细称重，发现总质量不变。以前人们以为东西燃烧后\"变轻了\"，其实是有气体跑掉了，或者有空气中的氧加了进来。他的妻子玛丽-安娜帮他记录数据、画实验图。\n\n**易错提醒：**配平时只能改化学式**前面的系数**，不能改右下角的小数字（下标）。改下标就变成另一种物质了：H₂O 是水，H₂O₂ 是过氧化氢。\n\n**试一试：**H₂ + O₂ → H₂O 怎么配平？（答案：2H₂ + O₂ → 2H₂O）", "能量守恒是什么意思？那为什么手机会没电？": "**一句话：**能量不会凭空产生，也不会消失，只会从一种形式**转化**成另一种。手机\"没电\"，是电池里的**化学能**都转化成别的能量了，并不是能量消失了。\n\n**原理（能量守恒定律 law of conservation of energy）：**手机用电时：\n- 电池的化学能 → 电能\n- 电能 → 屏幕的**光能**、扬声器的**声能**，还有很多**热能**（所以手机用久了会发烫）\n\n这些能量都还在，只是散到周围空气里了，很难再收回来用。充电时，电能又被存回电池，变成化学能。\n\n**来龙去脉：**19 世纪 40 年代，英国的**焦耳（James Joule）**让下落的重物带动水里的桨轮转动，测到水温升高了一点点，证明机械能可以变成热。能量单位\"焦耳（J）\"就是用他的名字命名的。\n\n**检查一下：**跑步后身体发热，是什么能量转化成了热能？", "我们怎么知道宇宙在膨胀？": "**一句话：**因为几乎所有遥远星系的光都**\"变红\"了（红移 redshift）**，而且越远的星系红得越厉害，说明它们都在离我们远去，而且越远跑得越快。\n\n**原理：**光也有**多普勒效应（Doppler effect）**。生活里，救护车开过来时警笛声变尖，开走时变低沉。光也一样：光源远离我们时，光波被\"拉长\"，颜色往红色那一端偏，这就是红移。\n\n**来龙去脉：**\n- 1927 年，比利时神父、物理学家**勒梅特（Lemaître）**提出宇宙在膨胀。\n- 1929 年，**哈勃（Hubble）**测量了很多星系，发现距离越远，红移越大。\n- 把时间倒推，宇宙过去应该更小、更热、更密，这就是**大爆炸理论（big bang theory）**。\n\n**易错提醒：**不是星系在空间里\"飞散\"，而是**空间本身在膨胀**。像在气球上画点，吹气时每个点都离其他点越来越远。\n\n**想一想：**如果宇宙一直在膨胀，往回倒推会发生什么？", "为什么 A 只能和 T 配对，G 只能和 C 配对？": "**一句话：**因为只有 A–T、G–C 这两种组合，**形状刚好吻合**，**氢键数量也对得上**，两条链之间的距离才能处处一样宽。\n\n**原理：**\n- **形状：**A 和 G 是\"大个子\"（两个环），T 和 C 是\"小个子\"（一个环）。大配小，每一级台阶的宽度刚好相同，DNA 才能整齐地拧成**双螺旋（double helix）**。\n- **氢键（hydrogen bonds）：**A–T 之间能形成 **2 条**氢键，G–C 之间能形成 **3 条**。A 和 C 虽然也是\"大配小\"，但氢键对不上位置，拉不住手。\n\n**来龙去脉：**约 1950 年，**查加夫（Chargaff）**测量了很多生物的 DNA，发现 A 的量总是约等于 T，G 约等于 C，但当时没人知道为什么。1953 年，**沃森和克里克**参考了**富兰克林（Rosalind Franklin）**拍的 X 射线照片搭出双螺旋模型，才明白原来是 A 配 T、G 配 C。\n\n**有用的地方：**知道一条链，就能写出另一条。细胞复制 DNA 时也正是\"照着配对规则抄\"。\n\n**试一试：**5′-GACT-3′ 的互补链是什么？（答案：3′-CTGA-5′）", "Genotype 和 phenotype 到底有什么区别？": "**一句话：****基因型（genotype）**是 DNA 里写着什么，看不见；**表现型（phenotype）**是表现出来、看得见或测得出的特征。\n\n**打个比方：**基因型 = **菜谱**，表现型 = **做出来的菜**。\n\n| | 基因型 Genotype | 表现型 Phenotype |\n|---|---|---|\n| 是什么 | 等位基因的组合 | 外在特征 |\n| 例子 | BB、Bb、bb | 棕眼、蓝眼 |\n\n**关键点：**\n1. **BB 和 Bb 是两种不同的基因型，却是同一种表现型（都是棕眼）**，因为 B 是显性。所以光看外表，分不出一只棕眼动物是 BB 还是 Bb，要用**测交（test cross）**来判断。\n2. **表现型 = 基因型 + 环境。**同一个菜谱，火候不同，菜也不同。例子：基因相同的绣球花，种在酸性土壤里开蓝花，种在碱性土壤里开粉花。\n\n**检查一下：**\"Bb\"是基因型还是表现型？\"有酒窝\"呢？", "能一步一步教我画 Bb × Bb 的庞氏表吗？": "当然可以！**庞氏表（Punnett square）**用来预测孩子各种基因型出现的概率。B = 棕眼（显性），b = 蓝眼（隐性）。\n\n**第 1 步　写出亲代：**爸爸 Bb，妈妈 Bb。\n\n**第 2 步　拆出配子（gametes）：**每人只传给孩子**一个**等位基因。爸爸给 B 或 b，妈妈也给 B 或 b，各 50% 机会。\n\n**第 3 步　画表：**爸爸的配子写在上面，妈妈的写在左边。\n\n| | **B** | **b** |\n|---|---|---|\n| **B** | BB | Bb |\n| **b** | Bb | bb |\n\n**第 4 步　填格子：**每格 = 上面的字母 + 左边的字母（大写写在前面）。\n\n**第 5 步　数结果：**\n- **基因型比** BB : Bb : bb = **1 : 2 : 1**\n- **表现型比** 棕眼 : 蓝眼 = **3 : 1**，所以蓝眼的概率是 **1/4（25%）**\n\n**易错提醒：**概率不是保证。一家生 4 个孩子，不一定刚好 1 个蓝眼；每个孩子都是独立的一次\"抽签\"。\n\n**试一试：**Bb × bb，孩子是蓝眼的概率是多少？", "为什么不能说细菌\"学会了\"抗药？": "**一句话：**因为抗药的**突变（mutation）**在用药**之前**就已经随机存在于少数细菌里，抗生素只是把不抗药的杀掉了，留下了本来就抗药的。细菌没有\"学\"，而是被**筛选**出来的。\n\n**原理（自然选择 natural selection）：**\n1. 细菌种群里，因为随机突变，有极少数天生带抗药基因。\n2. 用抗生素后，普通细菌死了，抗药的活下来。\n3. 活下来的抗药细菌大量繁殖，把抗药基因传给后代。\n4. 几代之后，种群里几乎全是抗药细菌，药就不管用了。\n\n**来龙去脉：**1952 年，**莱德伯格夫妇（Lederberg）**用一块天鹅绒像盖章一样，把培养皿里的细菌原样\"印\"到含抗生素的培养皿上。结果能活下来的菌落，在原来那个**从没碰过抗生素**的培养皿上早就在那里了，证明抗药突变是事先就有的。\n\n**考试这样写：**一定要用到 random mutation、survival、reproduction、population 这几个词。\n\n**想一想：**为什么医生说抗生素要按疗程吃完？", "教我配平 H₂ + O₂ → H₂O": "好！配平就是**数原子、补系数**。规则：只能改化学式前面的**系数**，不能改下标。\n\n**第 1 步　数原子：**\n- 左边：H = 2，O = 2\n- 右边：H = 2，O = **1** → 氧不平\n\n**第 2 步　先平氧：**在 H₂O 前面放 **2**：\nH₂ + O₂ → **2**H₂O\n- 右边：H = 4，O = 2 → 氧平了，但氢变成 4\n\n**第 3 步　再平氢：**在 H₂ 前面放 **2**：\n**2**H₂ + O₂ → **2**H₂O\n\n**第 4 步　检查：**\n- 左边：H = 4，O = 2\n- 右边：H = 4，O = 2 ✓\n\n**为什么要这样：**原子在反应中不会消失也不会凭空出现，这是**质量守恒定律（law of conservation of mass）**。\n\n**有趣的是：**这个反应会**放出大量能量（放热 exothermic）**，航天飞机的主发动机就是用液氢和液氧燃烧，产物只有水。\n\n**试一试：**配平 N₂ + H₂ → NH₃", "怎么快速判断一个反应是化合、分解还是置换？": "**一句话：**看反应前后物质\"几变几\"、谁和谁交换了位置。用字母 A、B、C、D 代表元素或原子团：\n\n| 类型 | 英文 | 样子 | 口诀 |\n|---|---|---|---|\n| 化合 | synthesis | A + B → AB | 多变一 |\n| 分解 | decomposition | AB → A + B | 一变多 |\n| 单置换 | single replacement | A + BC → AC + B | 单质换掉一个 |\n| 双置换 | double replacement | AB + CD → AD + CB | 两两交换 |\n| 燃烧 | combustion | 燃料 + O₂ → CO₂ + H₂O | 有氧气、出 CO₂ 和水 |\n| 中和 | neutralization | 酸 + 碱 → 盐 + 水 | 酸碱相遇 |\n\n**判断步骤：**\n1. 先看有没有 **O₂ 参加、生成 CO₂ 和 H₂O** → 燃烧\n2. 再看是不是**酸 + 碱** → 中和（它也是一种双置换）\n3. 反应物只有 1 种 → 分解；生成物只有 1 种 → 化合\n4. 有一个**单质**（单独的元素，如 Zn、Cl₂）参加 → 单置换；两个化合物交换\"搭档\" → 双置换\n\n**试一试：**Zn + 2HCl → ZnCl₂ + H₂ 是哪一种？（答案：单置换）", "放热反应和吸热反应怎么区分？举个生活例子": "**一句话：**反应后**周围变热**的是**放热反应（exothermic）**；反应后**周围变冷**的是**吸热反应（endothermic）**。\n\n**原理：**化学反应要先**断开**旧的化学键（需要吸收能量），再**形成**新的化学键（会放出能量）。\n- 放出的比吸收的多 → 多余能量以热的形式放出 → 放热\n- 吸收的比放出的多 → 从周围\"借\"热 → 周围变冷 → 吸热\n\n**生活例子：**\n| 放热 exothermic | 吸热 endothermic |\n|---|---|\n| 烧木头、点蜡烛 | 一次性冰敷袋（捏一下就变冷） |\n| 暖宝宝（铁生锈加速版） | 小苏打加醋（摸着会变凉） |\n| 你身体里细胞的呼吸作用 | 植物的光合作用 |\n\n**易错提醒：**放热反应也常常需要先\"点火\"，这一点点启动能量叫**活化能（activation energy）**。比如火柴要先摩擦才能点着。\n\n**检查一下：**把冰敷袋捏碎后变冷，是放热还是吸热？", "为什么把药片磨碎后溶解得更快？": "**一句话：**磨碎后**表面积（surface area）**变大了，更多的药粒同时接触到水，反应和溶解就更快。\n\n**原理：**反应（或溶解）只发生在两种物质**接触的地方**。一整块药片，只有外面一层碰得到水；磨成粉后，每一粒小粉末的表面都在接触水，总接触面积增加了很多倍。\n\n**影响反应速率的四个因素（考试常考）：**\n1. **表面积**：越大越快（磨碎、切小）\n2. **温度**：越高越快（粒子运动更快、碰撞更多更猛）\n3. **浓度**：越浓越快（单位体积里粒子更多，更容易碰到）\n4. **催化剂（catalyst）**：降低活化能，加快反应，但自己不被消耗\n\n**生活例子：**\n- 细木屑比一整根木头更容易烧起来（面粉厂甚至要防\"粉尘爆炸\"）\n- 食物放冰箱变质慢（温度低）\n- 你身体里的**酶（enzymes）**就是生物催化剂\n\n**提醒：**真正吃药前要按说明书和医生的话来，有些药片是不能磨碎的。\n\n**想一想：**为什么生火时要先用小木枝，再加大木头？", "动能和势能的公式怎么用？出一道题给我练": "**两个公式：**\n- **动能（kinetic energy）**：KE = ½mv²　（m 质量，单位 kg；v 速度，单位 m/s）\n- **重力势能（gravitational potential energy）**：PE = mgh　（g = 9.8 N/kg；h 高度，单位 m）\n- 结果单位都是**焦耳（J）**\n\n**用法要点：**\n1. 先把单位换成 **kg、m、m/s**（比如 500 g = 0.5 kg）\n2. 动能里的速度要**平方**，所以速度加倍，动能变成 **4 倍**\n3. 写出公式 → 代入数字和单位 → 算出答案带单位\n\n**例题：**一个 2 kg 的球从 5 m 高处由静止落下（忽略空气阻力）。\n- 落下前：PE = mgh = 2 × 9.8 × 5 = **98 J**，KE = 0\n- 落地前一瞬间：PE 全部变成 KE = **98 J**（**能量守恒**）\n- 速度：98 = ½ × 2 × v² → v² = 98 → v ≈ **9.9 m/s**\n\n**轮到你了：**一个 0.5 kg 的苹果挂在 3 m 高的树枝上。\n(a) 它的重力势能是多少？\n(b) 落到地面前一瞬间的动能约是多少？\n\n做完把答案发给我，我帮你检查！", "为什么效率不可能超过 100%？": "**一句话：**因为**能量守恒**：输出的能量不可能比输入的多。而且每台机器都会把一部分能量变成**没用的热或声音**，所以实际效率总是**小于 100%**。\n\n**公式：**效率（efficiency）= 有用的输出能量 ÷ 输入的总能量 × 100%\n\n**原理：**\n- 能量不会凭空产生，所以输出 ≤ 输入，效率最多 100%。\n- 现实中总有摩擦、电阻、振动，一部分能量\"漏\"成热能和声能散掉了。这部分能量并没有消失，只是**没被我们用上**。\n\n**生活例子（大约数字）：**\n| 设备 | 效率 |\n|---|---|\n| 老式白炽灯 | 约 5%（大部分变成热） |\n| LED 灯 | 高得多，所以更省电 |\n| 汽油车发动机 | 约 20–30% |\n| 电动机 | 常常超过 80% |\n\n**有趣的是：**历史上很多人想造不用能量就能一直转的\"永动机\"，全都失败了，正是因为违反了能量守恒。\n\n**检查一下：**一台机器输入 200 J，输出有用能量 150 J，效率是多少？（答案：75%）", "半衰期是什么意思？用一个比喻讲给我听": "**一句话：****半衰期（half-life）**是放射性原子**衰变掉一半**所需要的时间。\n\n**比喻：一盒会\"消失\"的爆米花。**\n想象一盒有 1000 颗特别的爆米花，规定每过 1 小时，**剩下的**里面恰好有一半会\"啪\"地变成别的东西。\n- 1 小时后：剩 500\n- 2 小时后：剩 250\n- 3 小时后：剩 125\n\n每过一个半衰期，就**减半一次**，永远不会一下子归零。\n\n**重要原理：**\n- 单个原子什么时候衰变是**随机**的，没法预测；但原子数量一多，整体就非常有规律。\n- 半衰期是每种放射性元素固定的\"性格\"，温度、压力都改变不了。\n\n**真实应用：碳-14 测年（radioactive dating）**\n- 碳-14 的半衰期约 **5730 年**。\n- 生物活着时体内碳-14 的比例和空气中一样，死后就只减不增。测出剩下多少，就能算出死了多久。\n- 这个方法是 1949 年**利比（Libby）**发明的，他因此获得了诺贝尔奖。\n\n**来龙去脉：**半衰期的概念来自**卢瑟福（Rutherford）**和索迪，他们当时正在加拿大蒙特利尔的麦吉尔大学研究放射性。\n\n**试一试：**一个样品有 800 个放射性原子，经过 3 个半衰期后还剩多少个？", "核裂变和核聚变有什么不同？": "**一句话：****裂变（fission）**是一个**大**原子核**分裂**成较小的核；**聚变（fusion）**是**小**原子核**合并**成较大的核。两者都会放出巨大的能量。\n\n| | 核裂变 fission | 核聚变 fusion |\n|---|---|---|\n| 过程 | 大核分裂（如铀-235） | 小核合并（如氢 → 氦） |\n| 在哪里 | 核电站 | **太阳**和其他恒星 |\n| 条件 | 用中子撞击 | 需要极高的温度和压力 |\n| 废料 | 有长期的放射性废料 | 很少 |\n| 现状 | 已经用来发电 | 还在实验阶段 |\n\n**记忆法：**fi**ss**ion 像 **s**plit（分开）；fu**s**ion 像 **f**use（融合）。\n\n**能量从哪来：**反应后产物的总质量比反应前**少了一点点**，少掉的质量变成了能量（爱因斯坦的 E = mc²，拓展，课本不考）。因为 c（光速）非常大，一点点质量就能变出巨大能量。\n\n**来龙去脉：**1938 年底，德国的**哈恩**和斯特拉斯曼发现铀核分裂了，奥地利物理学家**迈特纳（Lise Meitner）**和弗里施给出了解释。诺贝尔奖只颁给了哈恩，迈特纳被忽视，后来第 109 号元素以她的名字命名。\n\n**加拿大连接：**加拿大自己设计了 **CANDU** 核反应堆。\n\n**想一想：**为什么科学家这么想实现可控核聚变？", "大爆炸理论有哪些证据？": "**一句话：**主要有三大证据：**星系红移**、**宇宙微波背景辐射**，和宇宙中**轻元素的比例**。\n\n**证据 1：星系红移（redshift）→ 宇宙在膨胀**\n遥远星系的光都偏红，越远越红，说明它们都在远离我们。把时间倒推，宇宙过去更小、更热。（1929 年，哈勃）\n\n**证据 2：宇宙微波背景辐射（cosmic microwave background, CMB）→ 大爆炸留下的\"余温\"**\n1965 年，美国的**彭齐亚斯和威尔逊**发现天线里总有一个去不掉的微弱噪声，**从天空各个方向传来**。他们还以为是天线里的鸽子粪造成的，清理干净后噪声还在。后来才知道，这正是宇宙早期留下的热辐射，已经冷却到只比绝对零度高约 2.7 度。他们因此获得了诺贝尔奖。\n\n**证据 3：氢和氦的比例**\n理论预测宇宙早期应该形成大量的氢和氦，观测到的比例和预测吻合。\n\n**有趣的名字来源：**\"大爆炸（Big Bang）\"这个名字，是 1949 年**反对**这个理论的天文学家霍伊尔在广播里随口叫出来的，结果流传至今。\n\n**易错提醒：**大爆炸不是在空间里某一点发生的爆炸，而是**空间本身**从极热极密的状态开始膨胀。宇宙年龄约 **138 亿年**。\n\n**检查一下：**哪个证据说明宇宙\"曾经很热\"？", "红移是什么？为什么它能说明宇宙在膨胀？": "**一句话：****红移（redshift）**是光源远离我们时，光的波长被\"拉长\"、颜色往红色那一端偏移的现象。几乎所有遥远星系都红移，说明它们都在远离我们。\n\n**原理：多普勒效应（Doppler effect）**\n- 生活例子：救护车开**过来**时警笛声**变尖**，开**走**时声音**变低沉**。声源远离时，声波被拉长了。\n- 光也一样：光源**远离** → 波长变长 → 偏**红**（红移）；光源**靠近** → 波长变短 → 偏**蓝**（蓝移）。\n\n**怎么看出来：**每种元素发光时都有特定的\"条码\"（光谱线），像身份证一样。天文学家发现，遥远星系的这套\"条码\"整体往红色那边挪了，挪得越多，说明退行得越快。\n\n**为什么说明宇宙在膨胀：**1929 年，**哈勃**发现**越远的星系，红移越大**，退行越快。只有整个空间都在均匀膨胀时，才会出现\"越远跑得越快\"的规律。\n\n**比喻：**在没吹的气球上画几个点，吹气时，每个点都离其他点越来越远，而且离得越远的点，分开的速度越快。\n\n**来龙去脉：**多普勒效应由奥地利物理学家多普勒在 1842 年提出，原本研究的是声音和星星的颜色。\n\n**想一想：**如果一个星系发生了**蓝移**，说明什么？", "恒星的一生会经历哪些阶段？": "**一句话：**恒星在**星云**中诞生，靠核聚变发光度过大半生，最后的结局取决于它的**质量**。\n\n**一生的阶段：**\n1. **星云（nebula）**：气体和尘埃组成的巨大云团，在引力作用下收缩。\n2. **原恒星（protostar）**：越缩越热，核心温度够高时，**氢开始聚变成氦**，恒星\"点燃\"了。\n3. **主序星（main sequence star）**：一生中最长的稳定阶段。太阳现在就在这个阶段，已经约 46 亿年了。\n4. 氢快用完时，膨胀成**红巨星（red giant）**（大质量恒星会变成红超巨星）。\n\n**结局分两条路：**\n| 质量和太阳差不多 | 质量比太阳大很多 |\n|---|---|\n| 抛出外层，形成行星状星云 | 发生**超新星（supernova）**大爆炸 |\n| 剩下**白矮星（white dwarf）**，慢慢冷却 | 剩下**中子星（neutron star）**或**黑洞（black hole）** |\n\n**有趣的是：**比铁更重的很多元素，是在超新星爆炸中产生的。你身体里的一些原子，曾经在古老的恒星里形成。有句话说\"我们都是星尘\"。\n\n**来龙去脉：**1925 年，**佩恩（Cecilia Payne-Gaposchkin）**在博士论文中发现恒星主要由**氢和氦**组成，当时很多人不相信，后来证明她是对的。\n\n**检查一下：**太阳将来会变成黑洞吗？为什么？", "光年是时间单位还是距离单位？": "**一句话：****光年（light-year）是距离单位**，不是时间单位！它是光在一年里走过的距离。\n\n**有多远：**\n- 光速约每秒 **30 万公里**（1 秒钟能绕地球约 7.5 圈）。\n- 一年约有 3150 万秒，所以 1 光年 ≈ **9.5 万亿公里**。\n\n**为什么要用光年：**宇宙太大了，用\"公里\"写起来数字太长。比如：\n| 天体 | 距离 |\n|---|---|\n| 太阳 | 约 8 **光分钟** |\n| 最近的恒星（比邻星） | 约 4.2 光年 |\n| 银河系直径 | 约 10 万光年 |\n\n**超酷的事实：看星星就是看过去！**\n你今晚看到的比邻星的光，是 4 年多前出发的。看越远的天体，就是在看越早的宇宙。天文学家用望远镜研究宇宙早期，正是利用了这一点。\n\n**易错提醒：**名字里有\"年\"，很多人以为是时间单位，考试常拿这个来考。\n\n**想一想：**如果太阳突然消失了，我们要过多久才会发现？"};

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(text){
  // 中文标点紧挨 ** 时，标准 Markdown 不认加粗；先手动转换
  const pre = text.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
  try { return DOMPurify.sanitize(marked.parse(pre, { breaks:true, gfm:true })); }
  catch { return esc(text).replace(/\n/g,'<br>'); }
}

function msgHTML(m, i, last){
  if (m.role === 'user') {
    const img = m.imageUrl ? `<img src="${m.imageUrl}" alt="你发的图片">` : (m.image ? '<div style="opacity:.8;font-size:14px">［图片］</div>' : '');

  }
  const follow = last && !busy ? `<div class="follow">${FOLLOW.map(f => `<button data-q="${f}">${f}</button>`).join('')}</div>` : '';
  const tag = m.faq ? '<div class="faqtag">⚡ 预先写好的回答 · 不联网也能看 · 想追问就点下面的按钮</div>' : '';
  return `<div class="msg tutor">${avatar}<div class="bubble">${tag}<div class="md">${md(m.text || '')}</div>${follow}</div></div>`;
}
function renderLog(){
  const notice = '<p class="notice">小科老师是 AI。回答可能出错，重要内容请对照课本或问老师。</p>';
  if (!history.length) { log.innerHTML = helloHTML(); return; }
  const lastA = history.map(m => m.role).lastIndexOf('assistant');
  log.innerHTML = notice + history.map((m,i) => msgHTML(m, i, i === lastA && i === history.length-1)).join('');
  scrollDown();
}
function scrollDown(){ requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; }); }
log.addEventListener('click', e => {
  const b = e.target.closest('[data-q]'); if (!b || busy) return;
  ask(b.dataset.q);
});

// ---------- composer ----------
const input = $('#input'), send = $('#send');
function fit(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; }
function canSend(){ send.disabled = busy || (!input.value.trim() && !pending); }
input.addEventListener('input', () => { fit(); canSend(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); if (!send.disabled) go(); }
});
send.addEventListener('click', go);
function go(){ ask(input.value.trim()); }

$('#photoBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { pending = await shrink(f); $('#pvImg').src = pending.url; $('#preview').hidden = false; if (!input.value.trim()) input.placeholder = '可以补充一句：哪一步不会？'; canSend(); input.focus(); }
  catch { alert('这张图片打不开，请换一张试试。'); }
});
$('#pvDel').addEventListener('click', () => { pending = null; $('#preview').hidden = true; canSend(); });

// Scale photos down so they upload fast and cost less; Claude reads ~1568px fine.
function shrink(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1568, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL('image/jpeg', 0.85);
      resolve({ media_type:'image/jpeg', data: dataUrl.split(',')[1], url: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}

// ---------- talking to the tutor ----------
const NET_MSG = '连不上家教后台。请检查网络后再试。如果你在中国大陆，家教后台的网址（workers.dev）可能被屏蔽，需要换一个网络环境。';
async function fetchT(url, opts, ms){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...opts, signal: c.signal }); }
  catch (e) { throw new Error(NET_MSG); }
  finally { clearTimeout(t); }
}
function code(){ return store.get('tutor.code', ''); }
function apiMessages(list){
  return list.slice(-12).map((m, i, arr) => {
    if (m.role === 'assistant') return { role:'assistant', content: m.text };
    const parts = [];
    if (m.imageData && i === arr.length - 1) parts.push({ type:'image', source:{ type:'base64', media_type:m.imageData.media_type, data:m.imageData.data } });
    parts.push({ type:'text', text: m.text || (m.image ? '请帮我看看这道题。' : '') });
    return { role:'user', content: parts };
  });
}
function save(){
  // Store text only; photos stay in memory for this visit.
  store.set('tutor.history', history.slice(-40).map(m => ({ role:m.role, text:m.text, image: !!(m.image || m.imageUrl), faq: !!m.faq })));
}

async function ask(text){
  if (!pending && FAQ[text] && !busy) { // 预先写好的答案：秒出、不联网、不花钱
    history.push({ role:'user', text }, { role:'assistant', text: FAQ[text], faq:true });
    input.value = ''; fit(); save(); renderLog(); canSend(); return;
  }
  if (busy || (!text && !pending)) return;
  if (!API) { showError('家教后台地址还没设置。请家长打开 tutor/config.js 填入 workerUrl。'); return; }
  if (online === false) { showError(NET_MSG + ' 顶部的⚡推荐问题不用联网，可以直接点。'); checkNet(); return; }
  const um = { role:'user', text, image: !!pending };
  if (pending) { um.imageUrl = pending.url; um.imageData = { media_type: pending.media_type, data: pending.data }; }
  history.push(um);
  pending = null; $('#preview').hidden = true; input.value = ''; input.placeholder = '继续问，或者换个问题'; fit();
  const am = { role:'assistant', text:'' }; history.push(am);
  busy = true; canSend(); renderLog();
  const bubble = log.querySelector('.msg.tutor:last-child .md');
  bubble.innerHTML = '<span class="typing" aria-label="小科老师正在思考"><i></i><i></i><i></i></span>';

  const payload = { messages: apiMessages(history.slice(0, -1)), topic: topic === 'all' ? '' : topicObj().zh };
  try {
    const res = await fetchT(API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Access-Code': code() },
      body: JSON.stringify(payload)
    }, online === true ? 30000 : 12000);
    if (!res.ok) {
      let j = {}; try { j = await res.json(); } catch {}
      if (j.code === 'bad_code') { store.del('tutor.code'); $('#gate').hidden = false; }
      throw new Error(j.error || `连接出错（${res.status}），请稍后再试。`);
    }
    const left = res.headers.get('X-Questions-Left');
    if (left !== null) $('#left').textContent = `今天还能问 ${left} 次`;
    await readStream(res, chunk => { am.text += chunk; bubble.innerHTML = md(am.text); scrollIfNear(); });
    if (!am.text.trim()) throw new Error('老师没有回答，请再问一次。');
  } catch (err) {
    if (err.message === NET_MSG) { online = false; netbar.hidden = false; }
    history.pop(); // drop the empty/partial tutor turn
    const failed = history.pop(); // put the question back so it can be retried
    busy = false; save(); renderLog();
    showError(err.message || '网络不太好，请再试一次。', failed);
    return;
  }
  delete um.imageData; // don't resend the photo with later questions
  busy = false; save(); renderLog(); canSend();
}

async function readStream(res, onText){
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = block.split('\n').find(l => l.startsWith('data:'));
      if (!line) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
      if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') onText(ev.delta.text);
      else if (ev.type === 'error') throw new Error('老师这会儿有点忙，请过一分钟再问。');
    }
  }
}
function scrollIfNear(){ if (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 160) scroller.scrollTop = scroller.scrollHeight; }

function showError(msg, failed){
  const d = document.createElement('div'); d.className = 'msg tutor';
  d.innerHTML = `${avatar}<div class="bubble err">${esc(msg)}${failed ? ' <button>重新发送</button>' : ''}</div>`;
  if (failed) d.querySelector('button').onclick = () => {
    d.remove();
    if (failed.imageData) pending = { media_type: failed.imageData.media_type, data: failed.imageData.data, url: failed.imageUrl };
    ask(failed.text || '');
  };
  if (!history.length) log.innerHTML = '';
  log.appendChild(d); scrollDown(); canSend();
}

$('#newChat').addEventListener('click', () => {
  if (busy) return;
  history = []; save(); pending = null; $('#preview').hidden = true; renderLog(); input.focus();
});

// ---------- access code gate ----------
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const c = $('#code').value.trim(); if (!c) return;
  const btn = $('#gateBtn'), er = $('#gateErr'); er.hidden = true; btn.disabled = true; btn.textContent = '正在检查…';
  try {
    if (!API) throw new Error('家教后台地址还没设置。请家长打开 tutor/config.js 填入 workerUrl。');
    const r = await fetchT(API, { method:'POST', headers:{ 'Content-Type':'application/json', 'X-Access-Code': c }, body: JSON.stringify({ ping:true }) }, 15000);
    if (!r.ok) { let j = {}; try { j = await r.json(); } catch {} throw new Error(j.error || '暂时连不上，请稍后再试。'); }
    store.set('tutor.code', c); $('#gate').hidden = true; input.focus();
  } catch (err) {
    if (err.message === NET_MSG) { // 网络不通：先让孩子进来看推荐问题，口令等联网后再验证
      store.set('tutor.code', c); $('#gate').hidden = true; netbar.hidden = false;
    } else { er.textContent = err.message; er.hidden = false; }
  }
  btn.disabled = false; btn.textContent = '开始提问';
});

const netbar = document.createElement('p'); netbar.className = 'netbar'; netbar.hidden = true;
netbar.textContent = '现在连不上 AI 老师（网络问题）。推荐问题仍然可以直接看答案；其他问题等网络好了再问。';
document.querySelector('header .wrap').appendChild(netbar);
function checkNet(){
  if (!API) return;
  fetchT(API, { method:'GET' }, 8000).then(r => { online = r.ok; netbar.hidden = online; })
    .catch(() => { online = false; netbar.hidden = false; });
}
renderChips(); renderQuick(); renderLog(); fit(); canSend(); checkNet();
if (!code()) { $('#gate').hidden = false; }
})();
</script>
